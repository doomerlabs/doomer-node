name: agent-e2e
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  onboarding:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: agent-e2e
    defaults:
      run:
        working-directory: e2e-runner
    env:
      # Depot bootstrap only; test credentials remain in Doppler doomer/test.
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      E2E_REPORT_DIR: /tmp/component-agent-e2e
      COMPONENT_SOURCE: ${{ github.workspace }}/component
      CANDIDATE_SOURCE: ${{ github.workspace }}/candidate-cli
      COMPONENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: component
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned shared runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: doomerlabs/agent-e2e
          token: ${{ secrets.AGENT_E2E_READ_TOKEN }}
          ref: 279b6ac3190d600f8e1fde5b0f4e3014129655c6
          path: e2e-runner
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: doomerlabs/doomer
          # Source commit of the published CLI pinned by package.json.
          ref: f536afcf119c4e01e40b4425c9b6b5ae717da6b5
          path: candidate-cli
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version-file: e2e-runner/go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.20.0
      - name: Verify published CLI archive against pinned source
        run: |
          python3 - <<'PYTHON'
          import hashlib,json,os,pathlib,re,subprocess,urllib.request
          package=json.loads((pathlib.Path(os.environ['COMPONENT_SOURCE'])/'package.json').read_text())
          version=package['doomer']['cliVersion']
          expected_digest=package['doomer'].get('cliArchiveSha256','')
          if not re.fullmatch(r'20\d{2}\.\d{1,2}\.\d{1,2}\.\d+-beta\.\d+',version):
              raise SystemExit('Expected an exact CLI beta version')
          if not isinstance(expected_digest,str) or not re.fullmatch(r'[a-f0-9]{64}',expected_digest):
              raise SystemExit(f'Expected the Linux amd64 archive SHA-256 alongside the CLI pin for {version}')
          base=f'https://downloads.doomer.ai/cli/releases/{version}/'
          def download(name):
              request=urllib.request.Request(base+name,headers={'X-Doomer-Release-Verification':'1'})
              with urllib.request.urlopen(request,timeout=120) as response:
                  return response.read()
          manifest=json.loads(download('release-manifest.json'))
          commit=subprocess.check_output(['git','-C',os.environ['CANDIDATE_SOURCE'],'rev-parse','HEAD'],text=True).strip()
          if manifest.get('schemaVersion') != 1 or manifest.get('version') != version or manifest.get('commit') != commit:
              raise SystemExit('Published CLI does not match the pinned source')
          name=f'doomer_{version}_linux_amd64.tar.gz'
          archive=download(name)
          digest=hashlib.sha256(archive).hexdigest()
          if digest != expected_digest:
              raise SystemExit(f'Published CLI archive for {version} does not match the pinned SHA-256')
          checksums=[line.split() for line in download('checksums.txt').decode().splitlines()]
          if manifest.get('artifacts',{}).get(name) != 'sha256:'+digest or [digest,name] not in checksums:
              raise SystemExit('Published CLI archive checksum mismatch')
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/name
          target.write_bytes(archive)
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write(f'CANDIDATE_ARCHIVE={target}\nCANDIDATE_VERSION={version}\n')
          PYTHON
      - name: Select and run shared agent scenarios
        run: |
          python3 - <<'PYTHON'
          import json,os,pathlib,subprocess
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          description=pathlib.Path(os.environ['RUNNER_TEMP'])/'component-description.txt'
          description.write_text((event.get('pull_request') or {}).get('body') or '')
          args=['python3','scripts/with-test-secrets.py','python3','scripts/run.py','--require-cache',
                '--output',os.environ['E2E_REPORT_DIR'],'--changed-repo',os.environ['COMPONENT_SOURCE'],
                '--description-file',str(description)]
          if os.environ.get('COMPONENT_BASE'): args += ['--base',os.environ['COMPONENT_BASE']]
          if os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch': args.append('--full-suite')
          args += ['--cli-archive',os.environ['CANDIDATE_ARCHIVE'],'--candidate-label',os.environ['CANDIDATE_VERSION'],
                   '--node-source',os.environ['COMPONENT_SOURCE'],
                   '--skills-ref','3b496d0ab954b5791b81a0c1e452894e3667e5a9']
          raise SystemExit(subprocess.call(args))
          PYTHON
      - name: Validate selected result evidence
        run: python3 scripts/verify-results.py "$E2E_REPORT_DIR"
      - name: Retain selection and recordings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/component-agent-e2e/selection
            /tmp/component-agent-e2e/components.json
            /tmp/component-agent-e2e/cache-plan.json
            /tmp/component-agent-e2e/verified
            /tmp/component-agent-e2e/suite-*
            /tmp/component-agent-e2e/retries
          if-no-files-found: error
          retention-days: 14
