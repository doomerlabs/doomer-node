name: Publish npm package
on:
  push:
    tags: ['[0-9]*']
permissions:
  contents: read
  checks: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    # npm trusted publishing requires an actual GitHub-hosted runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: npm
    permissions:
      contents: read
      checks: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - run: npm install --global npm@11.15.0
      - name: Verify tag and successful Depot checks for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs gate "$RUNNER_TEMP/npm-release"
      - name: Reproduce and verify Depot-tested tarball
        id: package
        run: node scripts/release.mjs reproduce "$RUNNER_TEMP/npm-release"
      - name: Publish using npm trusted publishing
        if: steps.package.outputs.publish == 'true'
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.tarball }}
        run: npm publish "$PACKAGE_PATH" --ignore-scripts --access public --tag latest
      - name: Verify published bytes
        run: node scripts/release.mjs verify "$RUNNER_TEMP/npm-release"
